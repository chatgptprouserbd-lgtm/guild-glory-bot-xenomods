<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Master Engine - BD Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-cyan-400">DARK MASTER ENGINE</h1>
                <p class="text-xs text-slate-400 mt-1">AUTOMATED SQUAD & GUILD CONTROLLER (BD SERVER)</p>
            </div>
            <div class="flex gap-3">
                <button onclick="openModal()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg font-semibold text-sm transition">Add Account</button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <p class="text-slate-400 text-sm">Active Accounts</p>
                <h3 id="active-count" class="text-3xl font-bold text-cyan-400 mt-2">0</h3>
            </div>
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <p class="text-slate-400 text-sm">Server Status</p>
                <h3 class="text-3xl font-bold text-emerald-400 mt-2">Online</h3>
            </div>
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <p class="text-slate-400 text-sm">Target Region</p>
                <h3 class="text-3xl font-bold text-amber-400 mt-2">BD</h3>
            </div>
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <p class="text-slate-400 text-sm">Engine Uptime</p>
                <h3 id="uptime" class="text-3xl font-bold text-purple-400 mt-2">0s</h3>
            </div>
        </div>

        <!-- Guild Join Panel -->
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Guild Assignment</h2>
            <div class="flex gap-4">
                <input type="text" id="guild-id" placeholder="Enter Target Guild ID" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-500">
                <button onclick="joinGuild()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-semibold transition">Validate & Join Guild</button>
            </div>
            <p id="guild-status" class="text-sm mt-3 text-slate-400"></p>
        </div>
    </div>

    <!-- Modal for Adding Account -->
    <div id="accountModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-cyan-400">Add BD Account</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Account UID</label>
                    <input type="text" id="uid" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-500" placeholder="e.g. 8330341878">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Access Token</label>
                    <textarea id="access_token" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-500" placeholder="Paste access token here"></textarea>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm">Cancel</button>
                    <button onclick="addAccount()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg text-sm font-semibold">Save Account</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('accountModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('accountModal').classList.add('hidden'); }

        async function addAccount() {
            const uid = document.getElementById('uid').value;
            const access_token = document.getElementById('access_token').value;
            
            const formData = new URLSearchParams();
            formData.append('uid', uid);
            formData.append('access_token', access_token);
            formData.append('region', 'BD');

            const res = await fetch('/api/add_account', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
            if(data.status === 'success') { closeModal(); location.reload(); }
        }

        async function joinGuild() {
            const guild_id = document.getElementById('guild-id').value;
            const statusEl = document.getElementById('guild-status');
            statusEl.innerText = "Processing guild join request...";

            const res = await fetch('/api/join_guild', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id })
            });
            const data = await res.json();
            statusEl.innerText = JSON.stringify(data);
        }
    </script>
</body>
</html>
