<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODEXGOJO — Command Center & Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --void:#03040a;--bg:#06080f;--panel:rgba(12,18,32,0.85);--panel-2:#0d1524;--panel-3:#131c31;
  --border:rgba(255,255,255,0.06);--border-hi:rgba(0,240,255,0.3);
  --txt:#f1ecff;--txt-2:#b3a6d6;--txt-3:#6b7c99;
  --a:rgb(0,240,255);--b:rgb(168,85,247);--ok:rgb(124,255,74);--warn:rgb(255,184,77);--bad:rgb(255,45,85);
  --r:16px;--r-sm:10px;
  --display:'Orbitron',sans-serif;--ui:'Rajdhani',sans-serif;--mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ui);background:var(--void);color:var(--txt);padding:20px;min-height:100vh;}
.container{max-width:1440px;margin:0 auto;}
button{font-family:inherit;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;margin-bottom:20px;background:var(--panel);border:1px solid var(--border-hi);border-radius:var(--r);}
.brand{display:flex;align-items:center;gap:16px;}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;background:linear-gradient(135deg,var(--a),var(--b));color:#000;}
.glitch{font-family:var(--display);font-weight:900;font-size:22px;color:var(--txt);}
.tagline{font-size:12px;color:var(--txt-3);display:flex;align-items:center;gap:10px;margin-top:2px;}
.pill{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;border:1px solid var(--border-hi);}
.pill.live{color:var(--ok);border-color:rgba(124,255,74,.4);background:rgba(124,255,74,.08);}

.actions{display:flex;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--txt);background:rgba(255,255,255,.03);transition:.2s;}
.btn:hover{background:var(--panel-3);border-color:var(--a);}
.btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#000;border:0;}
.btn-success{background:linear-gradient(135deg,var(--ok),#3fd130);color:#000;border:0;}
.btn-warning{background:linear-gradient(135deg,var(--warn),#ff9800);color:#000;border:0;}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.stat-label{font-size:11px;font-weight:700;color:var(--txt-3);text-transform:uppercase;}
.stat-value{font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px;}

.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.panel-title{font-family:var(--display);font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;}

.toolbar{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--border);}
.input{width:100%;background:var(--void);border:1px solid var(--border-hi);border-radius:var(--r-sm);padding:8px 12px;color:var(--txt);outline:none;}

.accounts{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.account{padding:16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);}
.acc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.acc-name{font-weight:700;}
.acc-uid{font-size:11px;color:var(--txt-3);font-family:var(--mono);}
.status{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(124,255,74,.1);color:var(--ok);}

.logs-stream{height:480px;overflow-y:auto;padding:14px;font-family:var(--mono);font-size:11.5px;background:var(--void);line-height:1.6;}
.log-line{display:flex;gap:8px;}
.log-ts{color:var(--txt-3);}
.log-msg.success{color:var(--ok);}
.log-msg.error{color:var(--bad);}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:999;background:rgba(3,4,10,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.active{display:flex !important;}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border-hi);border-radius:var(--r);overflow:hidden;}
.modal-head{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-body{padding:20px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--txt-2);}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding-top:10px;}
.player-box{background:var(--void);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;}

.toasts{position:fixed;right:20px;top:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
.toast{min-width:220px;padding:10px 14px;border-radius:8px;background:var(--panel-2);border-left:3px solid var(--a);font-size:13px;}
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div class="container">
  <div class="topbar">
    <div class="brand">
      <div class="logo">C</div>
      <div>
        <div class="glitch">COMMAND CENTER</div>
        <div class="tagline"><span>Level Up Engine</span><span class="pill live" id="conn-pill">LIVE</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="fetchStats()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      <button class="btn btn-warning" onclick="openTeamBuilderModal()"><i class="fa-solid fa-users"></i> Add Bot Team</button>
      <button class="btn btn-success" onclick="openClanModal()"><i class="fa-solid fa-shield-halved"></i> Add New Clan</button>
      <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Active Accounts</div><div class="stat-value" id="stat-total-accounts">0</div></div>
    <div class="stat"><div class="stat-label">Total EXP Gained</div><div class="stat-value" id="stat-total-exp">0</div></div>
    <div class="stat"><div class="stat-label">Matches Done</div><div class="stat-value" id="stat-total-matches">0</div></div>
    <div class="stat"><div class="stat-label">Uptime</div><div class="stat-value" id="stat-uptime">00:00:00</div></div>
    <div class="stat"><div class="stat-label">Status</div><div class="stat-value" style="color:var(--ok);">RUNNING</div></div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-head"><div class="panel-title"><i class="fa-solid fa-list-ul"></i> MONITORED ACCOUNTS</div></div>
      <div class="accounts" id="accounts-container"><div style="padding:20px;text-align:center;">Loading accounts...</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title"><i class="fa-solid fa-terminal"></i> ACTIVITY LOG</div></div>
      <div class="logs-stream" id="log-stream"></div>
    </div>
  </div>
</div>

<!-- MODAL ADD ACCOUNT -->
<div class="overlay" id="add-modal">
  <div class="modal">
    <div class="modal-head"><h3>ADD ACCOUNT</h3><button class="btn" onclick="closeAddModal()">X</button></div>
    <div class="modal-body">
      <form onsubmit="submitAddAccount(event)">
        <div class="field"><label>Guest UID</label><input type="text" class="input" id="acc-uid" required></div>
        <div class="field"><label>Password</label><input type="password" class="input" id="acc-password" required></div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save & Start</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL ADD BOT TEAM -->
<div class="overlay" id="team-builder-modal">
  <div class="modal">
    <div class="modal-head"><h3>ADD BOT TEAM (4 PLAYERS)</h3><button class="btn" onclick="closeTeamBuilderModal()">X</button></div>
    <div class="modal-body">
      <form onsubmit="submitBotTeam(event)">
        <div class="field"><label>Team Name</label><input type="text" class="input" id="team-name" value="Team_RBC_1" required></div>
        <div class="player-box"><label>Player 1 (UID / Pass)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input type="text" class="input" id="p1-uid" placeholder="UID"><input type="text" class="input" id="p1-pass" placeholder="Password"></div></div>
        <div class="player-box"><label>Player 2 (UID / Pass)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input type="text" class="input" id="p2-uid" placeholder="UID"><input type="text" class="input" id="p2-pass" placeholder="Password"></div></div>
        <div class="player-box"><label>Player 3 (UID / Pass)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input type="text" class="input" id="p3-uid" placeholder="UID"><input type="text" class="input" id="p3-pass" placeholder="Password"></div></div>
        <div class="player-box"><label>Player 4 (UID / Pass)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><input type="text" class="input" id="p4-uid" placeholder="UID"><input type="text" class="input" id="p4-pass" placeholder="Password"></div></div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="closeTeamBuilderModal()">Cancel</button>
          <button type="submit" class="btn btn-warning">Create Team</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL ADD CLAN -->
<div class="overlay" id="clan-modal">
  <div class="modal">
    <div class="modal-head"><h3>ADD NEW CLAN</h3><button class="btn" onclick="closeClanModal()">X</button></div>
    <div class="modal-body">
      <form onsubmit="submitNewClan(event)">
        <div class="field"><label>Clan ID / UID</label><input type="text" class="input" id="clan-uid" required></div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="closeClanModal()">Cancel</button>
          <button type="submit" class="btn btn-success">Start Clan Request</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function toast(msg){ const el = document.createElement('div'); el.className='toast'; el.textContent=msg; $('#toasts').appendChild(el); setTimeout(()=>el.remove(), 3000); }

function openAddModal(){ $('#add-modal').classList.add('active'); }
function closeAddModal(){ $('#add-modal').classList.remove('active'); }
function openTeamBuilderModal(){ $('#team-builder-modal').classList.add('active'); }
function closeTeamBuilderModal(){ $('#team-builder-modal').classList.remove('active'); }
function openClanModal(){ $('#clan-modal').classList.add('active'); }
function closeClanModal(){ $('#clan-modal').classList.remove('active'); }

async function submitAddAccount(e){
  e.preventDefault();
  const res = await fetch('/api/account/add', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:$('#acc-uid').value, password:$('#acc-password').value})});
  closeAddModal(); toast('Account Added!'); fetchStats();
}

async function submitBotTeam(e){
  e.preventDefault();
  const players = [
    {uid:$('#p1-uid').value, pass:$('#p1-pass').value},
    {uid:$('#p2-uid').value, pass:$('#p2-pass').value},
    {uid:$('#p3-uid').value, pass:$('#p3-pass').value},
    {uid:$('#p4-uid').value, pass:$('#p4-pass').value}
  ].filter(p=>p.uid && p.pass);
  
  await fetch('/api/create_bot_team', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({team_name:$('#team-name').value, players})});
  closeTeamBuilderModal(); toast('Bot Team Created!'); fetchStats();
}

async function submitNewClan(e){
  e.preventDefault();
  await fetch('/api/add_clan', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({clan_uid:$('#clan-uid').value})});
  closeClanModal(); toast('Clan Join Initiated!'); fetchStats();
}

async function fetchStats(){
  try{
    const res = await fetch('/api/stats');
    const data = await res.json();
    $('#stat-total-accounts').textContent = data.total_accounts;
    $('#stat-total-exp').textContent = '+' + data.total_gained_exp;
    $('#stat-total-matches').textContent = data.total_matches;
    
    const box = $('#accounts-container');
    if(!data.accounts.length) box.innerHTML = '<div style="padding:20px;">No active accounts.</div>';
    else {
      box.innerHTML = data.accounts.map(a => `<div class="account">
        <div class="acc-row"><div class="acc-name">${a.nickname||'Player'}</div><span class="status">${a.status||'ONLINE'}</span></div>
        <div class="acc-uid">UID: ${a.uid}</div>
        <div style="font-size:12px;margin-top:6px;">Level: ${a.level||1} | EXP: ${a.current_exp||0}</div>
      </div>`).join('');
    }
    
    const logBox = $('#log-stream');
    logBox.innerHTML = data.logs.map(l => `<div class="log-line"><span class="log-ts">[${l.time}]</span><span class="log-msg ${l.level}">${l.message}</span></div>`).join('');
    logBox.scrollTop = logBox.scrollHeight;
  }catch(e){}
}

setInterval(fetchStats, 3000);
fetchStats();
</script>
</body>
</html>
